name: re-customer-care

services:
  minio:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports: ["9000:9000", "9333:9333", "8889:8888"]
    volumes:
      - minio_data:/data
      - ./conf/s3.json:/etc/seaweedfs/s3.json:ro

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dw
      POSTGRES_PASSWORD: dw123
      POSTGRES_DB: re_dw
    ports: ["5433:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root123
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]

  spark:
    build: .
    depends_on: [minio, postgres, mongo]
    environment:
      JUPYTER_TOKEN: bigdata
      PROJECT_DIR: /home/jovyan/work
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      USE_S3A: "0"
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: re_dw
      PG_USER: dw
      PG_PASSWORD: dw123
      MONGO_URI: mongodb://root:root123@mongo:27017/?authSource=admin
      KAFKA_BOOTSTRAP: kafka:9092
      SPARK_DRIVER_MEMORY: 4g
    ports: ["8888:8888", "4040:4040"]
    volumes: ["./:/home/jovyan/work"]

  kafka:
    image: apache/kafka:3.9.0
    profiles: ["streaming"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  minio_data:
  pg_data:
  mongo_data:
